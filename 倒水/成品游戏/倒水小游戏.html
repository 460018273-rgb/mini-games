<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>倒水小铺</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Arial,"Microsoft YaHei",sans-serif;background:#5d827f;color:#4a3023}
button{font:inherit;touch-action:manipulation}
#app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12px}
.screen{display:none;width:100%;max-width:760px;min-height:700px;min-height:min(760px,calc(100vh - 24px));background:#efc995;border:3px solid #f7e2bd;border-radius:22px;overflow:hidden;box-shadow:0 12px 30px rgba(45,28,18,.3)}
.screen.on{display:flex;flex-direction:column}
.menu{align-items:center;justify-content:center;text-align:center;padding:32px 18px;background:linear-gradient(#679793 0 30%,#be7a49 30%)}
.logo{font-size:44px;font-weight:bold;color:#fff8e8;text-shadow:0 4px #476e6c;margin:0 0 6px}
.sub{color:#eafffb;margin:0 0 42px}.menu-box{width:100%;max-width:360px;padding:22px;background:rgba(255,244,218,.94);border-radius:20px;box-shadow:0 8px 0 rgba(100,54,31,.25)}
.big,.small,.tool,.level-btn{border:0;border-radius:13px;cursor:pointer;font-weight:bold}
.big{display:block;width:100%;padding:15px;margin:10px 0;color:#52321f;background:#ffd66c;box-shadow:0 5px #bd7735;font-size:18px}
.big.secondary{background:#f5ead6;box-shadow:0 5px #b99b78}.big:active,.small:active,.tool:active{transform:translateY(2px);box-shadow:none}.big:disabled{opacity:.45;cursor:not-allowed}
.version{margin-top:22px;color:#f9e6cb;font-size:12px}
.topbar{min-height:84px;padding:13px 15px;color:#fff7e8;background:#638f8e;border-bottom:6px solid #8a5436;display:flex;align-items:center}.topbar>div:nth-child(2){flex:1;margin:0 10px}
.small{padding:9px 12px;background:#f5e5c9;color:#513321;box-shadow:0 3px #927255}.top-title{text-align:center;font-weight:bold;font-size:20px}.top-meta{text-align:center;font-size:12px;opacity:.9;margin-top:4px}.score{min-width:76px;text-align:center;padding:8px;border-radius:10px;background:rgba(31,80,78,.45);font-weight:bold}
.levels-wrap{padding:20px;overflow:auto}.levels-title{text-align:center;margin:2px 0 15px}.level-grid{display:flex;flex-wrap:wrap;justify-content:center}.level-btn{flex:1 0 58px;max-width:74px;height:54px;margin:5px;color:#52331f;background:#ffd778;box-shadow:0 4px #b97637}.level-btn.locked{color:#907c68;background:#ddcdb5;box-shadow:0 4px #a58e73}.level-btn.done:after{content:"✓";display:block;font-size:11px;color:#397461}
.game-body{position:relative;flex:1;display:flex;flex-direction:column;background:linear-gradient(90deg,rgba(104,55,28,.04) 1px,transparent 1px) 0 0/42px 100%,#b97847;overflow:hidden}
.board{position:relative;flex:1;min-height:410px;padding:20px 8px 10px;display:grid;grid-auto-rows:156px;align-content:start;justify-content:center;justify-items:center;overflow:auto}
.bottle{position:relative;width:62px;height:132px;margin:12px 0;padding:0;border:0;background:transparent;cursor:pointer;transition:transform .14s ease,opacity .16s;z-index:1}
.bottle.selected{transform:translateY(-11px);z-index:4}.bottle.blocked{animation:shake .25s}.bottle.transport{transform:translateY(-60px) scale(.85);opacity:0}.bottle.arrive{animation:arrive .18s ease-out}.bottle.pouring{z-index:30;transition:transform .15s ease-in-out}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes arrive{from{transform:translateY(-45px);opacity:0}to{transform:none;opacity:1}}
.neck{position:absolute;left:21px;top:0;width:22px;height:28px;border:4px solid rgba(255,249,235,.9);border-bottom:0;border-radius:6px 6px 2px 2px;background:rgba(255,255,255,.1);z-index:5}.lip{position:absolute;left:18px;top:0;width:28px;height:7px;border:3px solid #fff6e4;border-radius:5px;z-index:6}
.glass{position:absolute;left:7px;bottom:0;width:50px;height:112px;border:4px solid rgba(255,249,235,.9);border-radius:15px 15px 17px 17px;background:rgba(255,255,255,.09);box-shadow:inset 5px 0 rgba(255,255,255,.13),0 4px 5px rgba(77,40,21,.25);overflow:hidden}
.bottle.legal .glass{box-shadow:inset 5px 0 rgba(255,255,255,.13),0 0 0 3px #ffe26d,0 4px 5px rgba(77,40,21,.25)}
.glass:after{content:"";position:absolute;z-index:7;left:9px;top:9px;width:5px;height:70px;border-radius:4px;background:rgba(255,255,255,.31);pointer-events:none}.seg{position:absolute;left:0;right:0;height:24px;box-shadow:inset 0 4px rgba(255,255,255,.12)}
.fog-seg{background:linear-gradient(135deg,#aac4c1,#718f90)!important;box-shadow:inset 0 0 10px rgba(255,255,255,.6)}.mech{position:absolute;z-index:9;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;pointer-events:none}.ice{top:18px;right:2px;bottom:0;left:2px;border:2px solid #dff8ff;border-radius:16px;background:rgba(69,163,202,.78);font-size:23px;flex-direction:column;text-shadow:0 1px #246788}.ice small{font-size:11px;margin-top:4px}.valve{right:-1px;bottom:4px;width:25px;height:25px;border-radius:50%;background:#656b68;border:2px solid #e8e1d6;font-size:16px}.collector{left:19px;bottom:-3px;width:26px;height:21px;border-radius:4px 4px 10px 10px;background:#d9bd6f;border:2px solid #fff0b4;color:#67491f;font-size:14px}
.stream{position:absolute;z-index:29;width:7px;height:52px;border-radius:6px;opacity:0;transform-origin:top;pointer-events:none;box-shadow:0 0 4px rgba(255,255,255,.55)}
.board.busy{overflow:hidden}.bottle:focus-visible{outline:3px solid #ffe77c;outline-offset:2px}
.status{min-height:34px;padding:7px 12px;text-align:center;color:#fff1d8;background:rgba(91,48,27,.58);font-size:13px}.tools{min-height:76px;padding:8px;background:#895236;display:flex;align-items:center;justify-content:center;flex-wrap:wrap}.tool{min-width:92px;margin:4px;padding:10px 9px;color:#56351f;background:#f5e6cf;box-shadow:0 4px #aa7b50}.tool.primary{background:#ffd76d;box-shadow:0 4px #bd7532}.tool:disabled{opacity:.45;cursor:not-allowed}.tool small{display:block;font-size:10px;font-weight:normal;margin-top:2px}
.modal{display:none;position:fixed;z-index:100;top:0;right:0;bottom:0;left:0;padding:18px;background:rgba(31,22,18,.62);align-items:center;justify-content:center}.modal.on{display:flex}.dialog{width:100%;max-width:390px;padding:22px;text-align:center;border:4px solid #ffe0a0;border-radius:20px;background:#fff0cf;box-shadow:0 12px 35px rgba(0,0,0,.35)}.dialog h2{margin:0 0 10px}.dialog p{white-space:pre-line;line-height:1.55}.dialog-actions{display:flex;justify-content:center;flex-wrap:wrap;margin-top:15px}.dialog .small{min-width:100px;margin:4px}
.help{text-align:left;max-height:55vh;overflow:auto;font-size:14px}.help b{color:#386d68}.hidden{display:none!important}
@media(max-width:430px){#app{padding:0}.screen{min-height:100vh;border:0;border-radius:0}.topbar{min-height:76px;padding:10px 8px}.top-title{font-size:17px}.score{min-width:64px;font-size:13px}.board{padding:18px 3px 10px}.bottle{width:57px;transform:scale(.92);margin:8px 1px}.bottle.selected{transform:translateY(-9px) scale(.92)}.tool{min-width:78px;font-size:13px;padding:9px 6px}.logo{font-size:37px}}
</style>
</head>

<div id="app">
  <section id="menu" class="screen menu on">
    <h1 class="logo">倒水小铺</h1><p class="sub">把同色液体装满一杯，打包运走</p>
    <div class="menu-box">
      <button id="continueBtn" class="big hidden">继续游戏</button>
      <button id="levelsBtn" class="big">固定关卡</button>
      <button id="endlessBtn" class="big secondary">无尽模式</button>
      <button id="helpBtn" class="big secondary">玩法说明</button>
    </div><div class="version">离线单文件版 · 无音效</div>
  </section>
  <section id="levels" class="screen">
    <header class="topbar"><button class="small" data-back>返回</button><div><div class="top-title">固定关卡</div><div class="top-meta">共60关</div></div><span></span></header>
    <div class="levels-wrap"><h2 class="levels-title">选择关卡</h2><div id="levelGrid" class="level-grid"></div></div>
  </section>
  <section id="game" class="screen">
    <header class="topbar"><button id="gameBack" class="small">退出</button><div><div id="gameTitle" class="top-title"></div><div id="gameMeta" class="top-meta"></div></div><div id="gameScore" class="score"></div></header>
    <div class="game-body"><div id="board" class="board"></div><div id="status" class="status">请选择一个杯子</div>
      <div class="tools"><button id="undoBtn" class="tool">撤回一步<small>最多100步</small></button><button id="addBtn" class="tool primary">＋ 空杯<small id="addCount">0 / 2</small></button><button id="checkpointBtn" class="tool hidden">检查点<small>恢复最近存档</small></button><button id="restartBtn" class="tool">重新开始</button></div>
    </div>
  </section>
</div>
<div id="modal" class="modal"><div class="dialog"><h2 id="modalTitle"></h2><div id="modalText"></div><div id="modalActions" class="dialog-actions"></div></div></div>

function doPour(si,ti){var s=state.bottles[si],t=state.bottles[ti],amount=Math.min(visRun(s),4-t.v.length),left=amount,color=s.v[s.v.length-1],se,te,sr,tr,br,dx,dy,dir,tilt,stream;
 pushHistory();state.selected=null;busy=true;board.classList.add("busy");se=board.querySelector('[data-i="'+si+'"]');te=board.querySelector('[data-i="'+ti+'"]');sr=se.getBoundingClientRect();tr=te.getBoundingClientRect();br=board.getBoundingClientRect();dir=sr.left<tr.left?1:-1;dx=tr.left-sr.left-dir*50;dy=tr.top-sr.top-48;tilt=dir*64;se.classList.remove("selected");se.classList.add("pouring");se.style.transform="translateY(-16px)";
 setTimeout(function(){se.style.transform="translate("+dx+"px,"+dy+"px)";setTimeout(function(){se.style.transform="translate("+dx+"px,"+dy+"px) rotate("+tilt+"deg)";setTimeout(function(){stream=document.createElement("span");stream.className="stream";stream.style.background=COLORS[color][1];stream.style.left=(tr.left-br.left+tr.width/2-3+board.scrollLeft)+"px";stream.style.top=(tr.top-br.top-28+board.scrollTop)+"px";board.appendChild(stream);stream.style.transition="opacity .08s,transform .16s";void stream.offsetWidth;stream.style.opacity="1";stream.style.transform="scaleY(1)";
  setTimeout(function(){while(left--){t.v.push(s.v.pop())}if(s.fog>0)s.fog=Math.max(0,s.fog-amount);if(s.valve&&!s.v.length)s.valve=false;updateBottle(ti);setTimeout(function(){stream.style.opacity="0";setTimeout(function(){if(stream.parentNode)stream.parentNode.removeChild(stream);se=board.querySelector('[data-i="'+si+'"]');if(se){se.classList.add("pouring");se.style.transform="translate("+dx+"px,"+dy+"px)"}setTimeout(function(){if(se)se.style.transform="none";setTimeout(function(){updateBottle(si);board.classList.remove("busy");if(isComplete(t))completeBottle(ti,color);else finishMove()},130)},80)},50)},70)},100)
 },100)},150)},40)
}
function completeBottle(i,color){var el=board.querySelector('[data-i="'+i+'"]');if(el){el.classList.add("transport");setTimeout(function(){finishComplete(i,color)},180)}else finishComplete(i,color)}
function unlockAll(color){var i,b,l;for(i=0;i<state.bottles.length;i++){b=state.bottles[i];l=b.lock;if(!l)continue;if(l.t===0){l.n--;if(l.n<=0)b.lock=null}else if(l.c===color)b.lock=null}}
function unlockedCounts(a,excludeIdx){var counts=[0,0,0,0,0,0,0],i,j,b;for(i=0;i<a.length;i++){if(i===excludeIdx)continue;b=a[i];if(b.removed||b.lock||b.target!=null)continue;for(j=0;j<b.v.length;j++)if(b.v[j]<7)counts[b.v[j]]++}return counts}
function applyEndlessMechanism(b,board,bi){var s=state.score,slot=s%7,c,i,counts,cands;if(s<14)return b;if(s<35){if(slot===0)b.lock={t:0,n:1,c:null};return b}if(s<50){if(slot===0||slot===3)b.fog=b.v.length-1;return b}if(s<70){if(slot===0||slot===4)b.valve=true;if(slot===2)b.fog=b.v.length-1;return b}
 if(slot===0){b.lock={t:0,n:1,c:null};b.fog=b.v.length-1}else if(slot===2)b.valve=true;else if(slot===4){counts=unlockedCounts(board,bi);cands=[];for(i=0;i<7;i++)if(counts[i]>=4&&b.v.indexOf(i)<0)cands.push(i);for(i=0;i<cands.length;i++){c=cands[i];b.lock={t:1,n:0,c:c};if(canComplete(board,c))return b}b.lock={t:0,n:1,c:null}}else if(slot===6){b.valve=true;b.fog=b.v.length-1}return b
}
function simKey(a){var p=[],i,b;for(i=0;i<a.length;i++){b=a[i];if(b.removed)p.push("x");else p.push(b.v.join("")+"/"+(b.valve?1:0)+"/"+(b.lock?1:0)+"/"+(b.target==null?"-":b.target))}return p.sort().join("|")}
function simMoves(a){var moves=[],firstEmpty=-1,i,j,s,t,color,run,uniform;for(i=0;i<a.length;i++)if(!a[i].removed&&!a[i].lock&&!a[i].v.length&&a[i].target==null){firstEmpty=i;break}for(i=0;i<a.length;i++){s=a[i];if(s.removed||!s.v.length||s.lock||s.target!=null)continue;color=s.v[s.v.length-1];run=Math.min(topRun(s.v),s.v.length-s.fog);uniform=run===s.v.length;for(j=0;j<a.length;j++){if(i===j)continue;t=a[j];if(t.removed||t.lock||t.v.length>=4)continue;if(t.valve&&t.v.length)continue;if(t.target!=null&&color!==t.target)continue;if(t.v.length&&t.v[t.v.length-1]!==color)continue;if(!t.v.length&&(j!==firstEmpty||uniform))continue;moves.push([i,j,Math.min(run,4-t.v.length)])}}return moves}
function canComplete(a,color){var seen={},nodes=0;
 function go(cur,depth){var key,moves,k,m,next,s,t,c,n;if(depth>16||nodes++>4000)return false;key=simKey(cur);if(seen[key]!=null&&seen[key]<=depth)return false;seen[key]=depth;moves=simMoves(cur);for(k=0;k<moves.length;k++){m=moves[k];next=copyBottles(cur);s=next[m[0]];t=next[m[1]];c=s.v[s.v.length-1];for(n=0;n<m[2];n++)t.v.push(s.v.pop());if(s.fog>0)s.fog=Math.max(0,s.fog-m[2]);if(s.valve&&!s.v.length)s.valve=false;if(isComplete(t)&&(color==null||t.v[0]===color))return true;if(go(next,depth+1))return true}return false}
 return go(copyBottles(a),0)
}
function easeScore(b){var i,x,score=0,top=b.v[b.v.length-1];for(i=0;i<state.bottles.length;i++){x=state.bottles[i];if(x.removed||!x.v.length)continue;if(x.v[x.v.length-1]===top)score++;if(x.v.length===3&&x.v[0]===top&&x.v[1]===top&&x.v[2]===top)score+=8}return score}
function repackQueue(){var flat=[],i,j,tries,row,out;for(i=0;i<state.queue.length;i++)for(j=0;j<state.queue[i].v.length;j++)flat.push(state.queue[i].v[j]);for(tries=0;tries<80;tries++){shuffle(flat);out=[];for(i=0;i<flat.length;i+=4){row=flat.slice(i,i+4);if(row.length!==4||row[0]===row[1]||row[0]===row[2]||row[0]===row[3]||row[1]===row[2]||row[1]===row[3]||row[2]===row[3])break;out.push(bottle(row))}if(out.length===state.queue.length){state.queue=out;return true}}return false}
function chooseRefill(position){var attempt,order,i,index,candidate,trial,best=0;for(attempt=0;attempt<2;attempt++){order=[];for(i=0;i<state.queue.length;i++)order.push(i);order.sort(function(a,b){return easeScore(state.queue[a])-easeScore(state.queue[b])});for(i=0;i<order.length;i++){index=order[i];candidate=copyBottle(state.queue[index]);trial=copyBottles(state.bottles);trial[position]=candidate;applyEndlessMechanism(trial[position],trial,position);if(canComplete(trial,null)){state.queue.splice(index,1);return trial[position]}}if(!repackQueue())break}best=0;for(i=1;i<state.queue.length;i++)if(easeScore(state.queue[i])<easeScore(state.queue[best]))best=i;candidate=state.queue.splice(best,1)[0];trial=copyBottles(state.bottles);trial[position]=candidate;applyEndlessMechanism(trial[position],trial,position);if(trial[position].lock&&!canComplete(trial,null))trial[position].lock=null;return trial[position]}
function finishComplete(i,color){state.completed++;if(state.mode==="endless")state.score++;unlockAll(color);if(state.mode==="level"){state.bottles[i].removed=true;renderBoard();renderHUD();if(state.completed>=state.total){busy=false;winLevel();return}}
 else{if(!state.queue.length)state.queue=makeBatch();state.bottles[i]=chooseRefill(i);renderBoard(i);if(state.score%10===0)state.checkpoint=snap();if(state.score>progress.high)progress.high=state.score;renderHUD()}finishMove("完成一杯，已经运走！")}
function finishMove(msg){state.selected=null;busy=false;board.classList.remove("busy");renderHUD();say(msg||"倒水完成");safeSave();savedCurrent=serialize();if(!hasLegalMove())stuck()}
function hasLegalMove(){var i,j,s;for(i=0;i<state.bottles.length;i++){s=state.bottles[i];if(s.removed||!s.v.length||s.lock||s.target!=null)continue;for(j=0;j<state.bottles.length;j++)if(i!==j&&!invalid(i,j))return true}return false}
function onBottle(i){var b=state.bottles[i],msg;if(busy)return;if(state.selected==null){if(!b.v.length){reject(i,"请先选择一个有水的杯子");return}if(b.lock){reject(i,"这个杯子还没有解冻");return}if(b.target!=null){reject(i,"收集杯只能接水");return}state.selected=i;renderBoard();say("已选中，再点击高亮的目标杯");return}if(state.selected===i){state.selected=null;renderBoard();say("已取消选择");return}msg=invalid(state.selected,i);if(msg){state.selected=null;renderBoard();reject(i,msg);return}doPour(state.selected,i)}
function addCup(){if(busy||state.bonus>=2)return;state.bottles.push(bottle([]));state.bonus++;state.selected=null;renderBoard();renderHUD();say("增加了一个空杯，本局还可增加"+(2-state.bonus)+"个");safeSave()}
function undo(){if(busy||!history.length)return;restoreSnap(history.pop());say("已撤回一步")}
function restart(){if(busy)return;ask("重新开始？","当前进度会回到本关或本局起点。",[{text:"取消"},{text:"重新开始",primary:true,fn:function(){if(state.mode==="level")startLevel(state.level);else startEndless()}}])}
function restoreCheckpoint(){if(!state.checkpoint||busy)return;ask("恢复检查点？","将回到最近一次整10杯存档。",[{text:"取消"},{text:"恢复",primary:true,fn:function(){restoreSnap(state.checkpoint);say("已恢复最近检查点")}}])}
function winLevel(){var n=state.level;if(progress.unlocked<=n)progress.unlocked=Math.min(TOTAL_LEVELS+1,n+1);savedCurrent=null;try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:2,progress:progress,current:null}))}catch(e){}ask("第 "+n+" 关完成！","所有颜色都已经打包运走。",[{text:"返回关卡",fn:function(){levelButtons();showScreen(levels)}},{text:n<TOTAL_LEVELS?"下一关":"回到菜单",primary:true,fn:function(){if(n<TOTAL_LEVELS)startLevel(n+1);else{showScreen(menu);updateMenu()}}}])}
function stuck(){var actions=[{text:"继续看看"}];if(history.length)actions.push({text:"撤回一步",fn:undo});if(state.bonus<2)actions.push({text:"增加空杯",primary:true,fn:addCup});actions.push({text:"重新开始",fn:restart});ask("暂时倒不动了","可以撤回、增加空杯或重新开始。",actions)}
function ask(title,text,actions){var h="",i;E("modalTitle").textContent=title;E("modalText").innerHTML=text;for(i=0;i<actions.length;i++)h+='<button class="small '+(actions[i].primary?'primary':'')+'" data-action="'+i+'">'+actions[i].text+'</button>';E("modalActions").innerHTML=h;modal._actions=actions;modal.classList.add("on")}
function closeModal(){modal.classList.remove("on")}
function help(){ask("玩法说明",'<div class="help"><p><b>倒水：</b>先点来源杯，再点高亮目标杯。只能倒入空杯或顶部同色杯。</p><p><b>完成：</b>4格同色会自动打包运走。</p><p><b>冻结：</b>完成要求的杯数或颜色后立即解冻。</p><p><b>雾杯：</b>只显示最上层，倒走后揭示下一层。</p><p><b>阀门杯：</b>第一次倒空前只能往外倒。</p><p><b>收集杯：</b>只能接收杯内已有的颜色，不能往外倒。</p><p><b>作弊工具：</b>每局最多增加2个空杯，可以连续撤回最近100步。</p><p><b>无尽模式：</b>完成杯运走后补入一个四格四色的新杯。</p></div>',[{text:"知道了",primary:true}])}
board.addEventListener("click",function(e){var x=e.target;while(x&&x!==board&&(" "+x.className+" ").indexOf(" bottle ")<0)x=x.parentNode;if(x&&x!==board)onBottle(+x.getAttribute("data-i"))});
E("levelsBtn").onclick=function(){levelButtons();showScreen(levels)};E("endlessBtn").onclick=function(){if(progress.unlocked>=5)startEndless()};E("helpBtn").onclick=help;E("continueBtn").onclick=function(){if(restoreData(savedCurrent))openGame()};document.querySelector("[data-back]").onclick=function(){showScreen(menu);updateMenu()};E("gameBack").onclick=function(){if(!busy){safeSave();savedCurrent=serialize();showScreen(menu);updateMenu()}};
E("levelGrid").addEventListener("click",function(e){var n=+(e.target.getAttribute("data-level")||0);if(n&&n<=progress.unlocked)startLevel(n)});E("undoBtn").onclick=undo;E("addBtn").onclick=addCup;E("restartBtn").onclick=restart;E("checkpointBtn").onclick=restoreCheckpoint;E("modalActions").addEventListener("click",function(e){var i=e.target.getAttribute("data-action"),a;if(i==null)return;a=modal._actions[+i];closeModal();if(a&&a.fn)a.fn()});
window.addEventListener("beforeunload",safeSave);document.addEventListener("visibilitychange",function(){if(document.hidden&&state)safeSave()});updateMenu();
})();
</script>
