function render(){const lv=LEVELS[levelIndex];cell=Math.min(28,Math.max(16,760/Math.max(lv.rows,lv.cols)));margin=24;const w=margin*2+(lv.cols-1)*cell,h=margin*2+(lv.rows-1)*cell;board.setAttribute('viewBox','0 0 '+w+' '+h);board.setAttribute('width',w);board.setAttribute('height',h);clearBoard();const active=new Set(lv.pieces.map(p=>p.name));for(let r=1;r<=lv.rows;r++)for(let c=1;c<=lv.cols;c++)board.appendChild(svg('circle',{class:'grid-dot',cx:margin+(c-1)*cell,cy:margin+(r-1)*cell,r:Math.max(2,cell*.08)}));for(const p of lv.pieces){for(const q of p.cells)occupancy.set(q[0]+','+q[1],p.name);if(removed.includes(p.name))continue;const g=svg('g',{class:'line','data-id':p.name});const body=svg('polyline',{class:'body',points:pathPoints(lv,p),stroke:'#121a43'});const hit=svg('polyline',{class:'hit',points:pathPoints(lv,p)});const tail=svg('circle',{class:'tail',r:Math.max(2.5,cell*.11)});const [tx,ty]=xy(lv,p.cells[0]);tail.setAttribute('cx',tx);tail.setAttribute('cy',ty);const head=svg('polygon',{class:'arrow',fill:'#121a43',points:arrowPoints(lv,p)});g.append(body,tail,head,hit);hit.addEventListener('click',()=>clickLine(p));board.appendChild(g);nodes.set(p.name,{g,body,tail,head});}titleEl.textContent='线条脱困 · '+(lv.name||('第'+(levelIndex+1)+'关'));levelNo.textContent=String(levelIndex+1);countEl.textContent=String(removed.length);totalEl.textContent=String(lv.pieces.length);bestEl.textContent=best[levelIndex]??'--';winEl.classList.remove('show');hintEl.textContent='点击箭头前方没有障碍的线条。';for(const o of selectEl.options)o.textContent='第 '+(Number(o.value)+1)+' 关'}
function pathModel(lv,p){const pts=p.cells.map(q=>xy(lv,q)),cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));const len=cum[cum.length-1],h=p.cells[p.cells.length-1],d=DIR[p.dir],exit=d[1]>0?(lv.cols-h[1]+2)*cell:d[1]<0?(h[1]+1)*cell:d[0]>0?(lv.rows-h[0]+2)*cell:(h[0]+1)*cell,total=len+exit;function at(dist){if(dist<=len){let i=1;while(i<cum.length&&cum[i]<dist)i++;const f=(dist-cum[i-1])/(cum[i]-cum[i-1]||1);return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f]}const end=pts[pts.length-1];return [end[0]+d[1]*(dist-len),end[1]+d[0]*(dist-len)]}return{at,len,total}}
function setArrow(node,pos,p){const h=p.cells[p.cells.length-1],prev=p.cells[p.cells.length-2],d=DIR[p.dir],tip=[pos[0]+d[1]*9,pos[1]+d[0]*9],perp=[-d[0]*7,d[1]*7],base=[pos[0]-d[1]*2,pos[1]-d[0]*2];node.head.setAttribute('points',[tip,[base[0]+perp[0],base[1]+perp[1]],[base[0]-perp[0],base[1]-perp[1]]].map(q=>q.join(',')).join(' '))}
function animate(lv,p,node){busy=true;node.g.classList.add('moving');const model=pathModel(lv,p),dur=Math.min(650,310+(p.cells.length-1)*8),start=performance.now(),samples=Math.max(10,Math.ceil(model.len/4));function frame(now){const t=Math.min(1,(now-start)/dur),shift=model.total*t,points=[];for(let i=0;i<=samples;i++){const d=model.len*i/samples+shift;if(d<=model.total)points.push(model.at(d).join(','))}node.body.setAttribute('points',points.join(' '));const tailDist=shift,headDist=model.len+shift;const tailPos=model.at(tailDist),headPos=model.at(headDist);node.tail.setAttribute('cx',tailPos[0]);node.tail.setAttribute('cy',tailPos[1]);setArrow(node,headPos,p);if(t<1)requestAnimationFrame(frame);else{node.g.remove();removed.push(p.name);busy=false;countEl.textContent=String(removed.length);if(removed.length===lv.pieces.length){winShown();}else{hintEl.textContent='继续点击可抽出的箭头。'}}}requestAnimationFrame(frame)}
function clickLine(p){if(busy||removed.includes(p.name))return;const lv=LEVELS[levelIndex],active=new Set(lv.pieces.filter(x=>!removed.includes(x.name)).map(x=>x.name)),block=rayBlock(lv,p,active),node=nodes.get(p.name);if(block){node.g.classList.add('blocked');hintEl.innerHTML='<span class="danger">这根线被 '+block+' 挡住了。</span>';setTimeout(()=>node.g.classList.remove('blocked'),320);return}hintEl.textContent=p.name+' 开始抽绳';animate(lv,p,node)}
function winShown(){winEl.classList.add('show');const old=best[levelIndex];if(old===undefined||removed.length<old){best[levelIndex]=removed.length;try{localStorage.setItem('lineEscapeBest',JSON.stringify(best))}catch(e){}bestEl.textContent=String(removed.length)}}
function load(i){if(busy)return;levelIndex=Math.max(0,Math.min(LEVELS.length-1,i));removed=[];render()}
document.getElementById('restart').onclick=()=>load(levelIndex);document.getElementById('prev').onclick=()=>load(levelIndex-1);document.getElementById('next').onclick=()=>load(levelIndex+1);selectEl.onchange=()=>load(Number(selectEl.value));document.getElementById('undo').onclick=()=>{if(busy||!removed.length)return;removed.pop();render()};for(let i=0;i<LEVELS.length;i++){const o=document.createElement('option');o.value=String(i);o.textContent='第 '+(i+1)+' 关';selectEl.appendChild(o)}load(0);
</script></body></html>
